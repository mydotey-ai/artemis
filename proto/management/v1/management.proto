syntax = "proto3";
package artemis.management.v1;
import "common/v1/model.proto";
option java_package = "org.mydotey.ai.artemis.proto.management.v1";
option java_multiple_files = true;

// 管理面契约（治理期演进，不随数据面冻结；client SDK 不生成本组）。
//
// 当前内容：registry 只读事实查询（ADR-016）——由 management-service 消费、registry 实现。
// 后续治理规则 / 规则版本 + ack / 账户等契约随管理面版本在本组演进。

// ---- registry 只读事实查询（v0.1）----
// registry 只返回事实、不感知摘除；敏感配置值在本侧脱敏后返回。

message ListServicesRequest {
  // 空 = 全部 namespace
  string namespace = 1;
}

message ServiceSummary {
  artemis.common.v1.ServiceKey key = 1;
  int32 instance_count = 2;
}

message ListServicesResponse {
  artemis.common.v1.ResponseStatus status = 1;
  ListServicesResponseData data = 2;
}

message ListServicesResponseData {
  repeated ServiceSummary services = 1;
}

message GetServiceInstancesRequest {
  artemis.common.v1.ServiceKey key = 1;
}

message GetServiceInstancesResponse {
  artemis.common.v1.ResponseStatus status = 1;
  GetServiceInstancesResponseData data = 2;
}

message GetServiceInstancesResponseData {
  // 未注册 service → 空数组 + SUCCESS（查询语义，不是错误）
  repeated artemis.common.v1.Instance instances = 1;
}

message GetLeaseStatusRequest {
  // 可选过滤：空 = 全部；大集群按 service 查询避免单次响应超限
  string namespace = 1;
  string service = 2;
}

message SelfProtectionStats {
  int64 window_renewals = 1;
  int64 max_count = 2;
  bool protecting = 3;
}

message LeaseDetail {
  artemis.common.v1.ServiceKey service = 1;
  string instance_id = 2;
  int64 age_ms = 3;
  int64 remaining_ttl_ms = 4;   // 可为负：已到期待清理
}

message GetLeaseStatusResponse {
  artemis.common.v1.ResponseStatus status = 1;
  GetLeaseStatusResponseData data = 2;
}

message GetLeaseStatusResponseData {
  SelfProtectionStats protection = 1;
  repeated LeaseDetail leases = 2;
  // 租约数超过服务端单次返回上限（10000）时为 true，调用方应按 service 分别查询
  bool truncated = 3;
}

// ---- 自我保护 2.0 按服务状态（v0.2 phase-4，ADR-017）----

message GetSelfProtectionStatusRequest {
  // 可选过滤：空 = 全部
  string namespace = 1;
  string service = 2;
  // 默认 false：未指定 service 时仅返回 PROTECTING 服务。
  // 指定 namespace + service 时该服务总是返回（无本地窗口时零计数并按节点级兜底）；
  // 仅指定 service 且无匹配本地窗口时返回空。
  bool include_normal = 3;
}

message ServiceSelfProtectionStatus {
  artemis.common.v1.ServiceKey service = 1;
  int64 window_renewals = 2;   // 当前窗口只读求和
  int64 max_count = 3;         // 历史峰值（可能已回落）
  // 服务级未启用（无本地窗口或峰值未达 minCount）：过期清理取 node.protecting 判定
  bool node_fallback = 6;
  // 服务级显式状态：node_fallback=true 时实际保护判定 = node.protecting
  bool protecting = 4;
  // 服务级 PROTECTING 已持续时长（单调钟计算，跨进程不可比）；NORMAL 时为 0
  int64 protecting_for_ms = 5;
}

message GetSelfProtectionStatusResponse {
  artemis.common.v1.ResponseStatus status = 1;
  GetSelfProtectionStatusResponseData data = 2;
}

message GetSelfProtectionStatusResponseData {
  int64 tracked_services = 1;
  // 服务级 PROTECTING 服务数（即默认 services 列表口径；节点级兜底的服务不计入）
  int64 protecting_services = 2;
  // 按 (namespace, service) 升序；默认仅 PROTECTING，include_normal 时含 NORMAL
  repeated ServiceSelfProtectionStatus services = 3;
  // 超过服务端单次返回上限（10000）时为 true
  bool truncated = 4;
  // 节点级窗口统计（v0.1 语义，用于区分节点级故障与单服务异常）
  SelfProtectionStats node = 5;
}

message GetConfigStatusRequest {}

message ConfigProperty {
  string key = 1;
  string value = 2;             // 敏感项固定 "******"（default_value 同样脱敏）
  string source = 3;            // 配置来源名；未命中任何 source 时为空
  bool is_static = 4;
  string default_value = 5;     // 敏感项固定 "******"
  string doc = 6;
}

message GetConfigStatusResponse {
  artemis.common.v1.ResponseStatus status = 1;
  GetConfigStatusResponseData data = 2;
}

message GetConfigStatusResponseData {
  // 按 key 升序
  repeated ConfigProperty properties = 1;
}

// registry 实现的只读查询：management-service 经此组合有效视图与状态面。
service RegistryQueryService {
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc GetServiceInstances(GetServiceInstancesRequest) returns (GetServiceInstancesResponse);
  rpc GetLeaseStatus(GetLeaseStatusRequest) returns (GetLeaseStatusResponse);
  rpc GetConfigStatus(GetConfigStatusRequest) returns (GetConfigStatusResponse);
  rpc GetSelfProtectionStatus(GetSelfProtectionStatusRequest) returns (GetSelfProtectionStatusResponse);
}

// ---- 摘除规则订阅流（management → discovery，v0.3 phase-6，架构 §2.2 通道①）----
// 绑定 management 内部 gRPC 端口（条件启用）；版本 + ack 生效水位归 v0.4 完整规则链。

// 四级摘除目标（v0.4 phase-3，wire 兼容：缺省 INSTANCE 承载 v0.3 既有事件）。
// SERVER/ZONE/GROUP 级按实例 metadata 键匹配（server/zone/group，ADR-013 延伸），
// 全局生效（不绑 service）；INSTANCE 级按 (namespace, service, instanceId) 定位。
enum EjectionScope {
  EJECTION_SCOPE_INSTANCE = 0;
  EJECTION_SCOPE_SERVER = 1;
  EJECTION_SCOPE_ZONE = 2;
  EJECTION_SCOPE_GROUP = 3;
}

message EjectionRule {
  artemis.common.v1.ServiceKey service = 1;   // INSTANCE 级必填
  string instance_id = 2;                     // INSTANCE 级必填
  string reason = 3;            // 排障用
  EjectionScope scope = 4;      // 缺省 INSTANCE
  string target_value = 5;      // SERVER/ZONE/GROUP 级：metadata 值
}

message EjectionRulesRequest {
  string subscriber_id = 1;     // 订阅方标识（排障用）
}

message EjectionRulesSnapshot {
  repeated EjectionRule rules = 1;   // 可为空集（无摘除）
}

message EjectionRecovered {
  artemis.common.v1.ServiceKey service = 1;
  string instance_id = 2;
  EjectionScope scope = 3;      // 缺省 INSTANCE
  string target_value = 4;      // SERVER/ZONE/GROUP 级
}

// 流事件 envelope（非 unary Response，不适用 status + data 规范，对齐 projection.v1 先例）：
// 已设 snapshot = 全量快照（替换语义——消费方全量重建本地规则集，含空集）；未设 = 增量
// （ejected/recovered 互斥，单条消息恰一 action）。message presence 区分空快照与增量。
// v0.4 phase-3：快照/增量含四级；增量仅在目标生效态翻转时产生（叠加/对消无翻转不推）。
message EjectionRulesEvent {
  EjectionRulesSnapshot snapshot = 1;
  EjectionRule ejected = 2;
  EjectionRecovered recovered = 3;
}

service EjectionRuleService {
  // 摘除规则订阅：首条快照（含空集）→ 其后增量按产生序；gRPC 单流天然有序。
  // at-most-once、无版本/ack：慢消费者/推送失败由服务端断流注销，消费方断流重连重新
  // 收快照全量覆盖自愈（丢失窗口 = 断流期间变更，重连快照收敛）。
  // management 内存态（v0.1/v0.3）：management 重启规则清零，重连空快照即摘除消失
  // （roadmap 期 1 设计内行为，v0.4 DB 接管闭环）。
  rpc WatchEjections(EjectionRulesRequest) returns (stream EjectionRulesEvent);
}

// ---- 逻辑实例订阅流（management → discovery，v0.4 phase-4，架构 §2.2 通道① 同端口）----
// 逻辑实例 = 管理面维护的静态实例（第三方/异构服务，不经注册体系），进 discovery
// 统一发现视图（discovery 以保留 cluster 进投影 union）。快照 + 增量、at-most-once、
// 无版本/ack：数据语义快照自愈（对齐通道③投影流；规则版本化归规则流 phase-5）。

message LogicalInstance {
  artemis.common.v1.ServiceKey service = 1;
  artemis.common.v1.Instance instance = 2;   // protocol/url 等扩展属性以 metadata 表达（D13 延伸）
}

message LogicalInstanceKey {
  artemis.common.v1.ServiceKey service = 1;
  string instance_id = 2;
}

message LogicalInstancesRequest {
  string subscriber_id = 1;     // 订阅方标识（排障用）
}

message LogicalInstancesSnapshot {
  repeated LogicalInstance instances = 1;   // 可为空集
}

// 流事件 envelope（message presence 区分空快照与增量，对齐 EjectionRulesEvent 先例；
// upserted/deleted 互斥，单条消息恰一 action；upserted 为 upsert 语义——消费方以
// UPDATE 承接（投影 apply 与订阅翻译均为覆盖语义，恒正确）。
message LogicalInstancesEvent {
  LogicalInstancesSnapshot snapshot = 1;
  LogicalInstance upserted = 2;
  LogicalInstanceKey deleted = 3;
}

service LogicalInstanceService {
  // 订阅：首条快照（含空集）→ 其后增量按产生序；gRPC 单流天然有序。at-most-once：
  // 慢消费者/推送失败由服务端断流注销，消费方断流重连重新收快照全量覆盖自愈。
  rpc WatchLogicalInstances(LogicalInstancesRequest) returns (stream LogicalInstancesEvent);
}
