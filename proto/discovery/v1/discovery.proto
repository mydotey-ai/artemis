syntax = "proto3";
package artemis.discovery.v1;
import "common/v1/model.proto";
option java_package = "org.mydotey.ai.artemis.proto.discovery.v1";
option java_multiple_files = true;

// SDK → discovery 查询契约（架构 §2.2 外部端口）。v0.3 phase-2 交付 unary 查询；
// 订阅推送 rpc 随 phase-3 以新增 rpc 演进（wire 兼容，field number/rpc 名只增）。
// 选择器模型与订阅共用（v0.3 plan）：services 精确集合（空 = 全部服务）+
// labels 实例 metadata 全键值匹配（实例级过滤——分组以实例 metadata 表达，ADR-013）+
// clusters 来源 cluster 过滤（空 = 全部/union，phase-5 多集群聚合）。

message QueryRequest {
  repeated artemis.common.v1.ServiceKey services = 1;  // 空 = 全部服务
  map<string, string> labels = 2;                      // 实例须含全部键值才入选
  repeated string clusters = 3;                        // 来源 cluster 过滤（v0.3 phase-5）：空 = 全部（union）；未知 cluster 名静默无命中
}

// 投影视图单元：cluster 是来源标识，由 discovery 在投影边界注入（ADR-014，registry 契约不携带）
message ClusterServiceInstances {
  string cluster = 1;
  artemis.common.v1.ServiceInstances instances = 2;    // service 实例集快照（ADR-007 单元）
}

message QueryResponseData {
  repeated ClusterServiceInstances services = 1;
  repeated UpstreamStatus upstreams = 2;  // 新鲜度元信息（v0.3 phase-4）：非 SYNCED = 数据可能陈旧
}

message QueryResponse {
  artemis.common.v1.ResponseStatus status = 1;
  QueryResponseData data = 2;
}

service DiscoveryQueryService {
  // 查询当前投影。未就绪（首轮 bootstrap 未完成）UNAVAILABLE——空数据不作真相返回。
  rpc Query(QueryRequest) returns (QueryResponse);
}

// ---- 订阅推送（SDK → discovery，架构 §2.2 外部端口；v0.3 phase-3，ADR-019）----

// 实例变更（视图语义）。与 projection.v1 同构：该组是 registry→discovery 内部契约，
// 组间不横向 import（proto-contract §1 import 只向 common）；两处 proto 各自映射到
// discovery-core domain 同一模型（语义单一来源）。
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_UNKNOWN = 1;   // 本地映射目标
  CHANGE_TYPE_NEW = 2;
  CHANGE_TYPE_UPDATE = 3;
  CHANGE_TYPE_DELETE = 4;    // instance 至少携带 instance_id，其余字段无意义
}

message InstanceChange {
  artemis.common.v1.Instance instance = 1;
  ChangeType type = 2;
}

// 单服务变更：key 下的变更保持产生序
message ServiceChange {
  artemis.common.v1.ServiceKey key = 1;
  repeated InstanceChange changes = 2;
}

message SubscribeRequest {
  repeated artemis.common.v1.ServiceKey services = 1;  // 空 = 全部服务（语义同 QueryRequest）
  map<string, string> labels = 2;                      // 实例级过滤（语义同 QueryRequest）
  repeated string clusters = 3;                        // 来源 cluster 过滤（语义同 QueryRequest，v0.3 phase-5）
}

// 流事件：单 service 视图变更 + 来源 cluster（cluster 归因是多集群聚合的确定需求，
// phase-5「可按 cluster 过滤」；per-service 分条下事件与 cluster 一一对应）。
// 首条两字段均未设 = 订阅建立确认（对齐 projection.v1 Watch 空批先例）；确认后逐
// service 推送命中基线（全 NEW），稳态推增量变更。
message SubscriptionEvent {
  string cluster = 1;         // 来源 cluster（投影边界注入，ADR-014）
  ServiceChange service = 2;  // 单 service 视图语义变更
}

service DiscoverySubscriptionService {
  // 订阅推送（推拉结合之「推」，ADR-019）：一流多目标，单流内按产生序有序；
  // 上游（registry）断连重连对订阅方透明——覆盖差异以 diff 增量续推，流不断。
  // at-most-once：慢消费者（isReady 背压）由服务端断流，消费方重订阅重新基线
  // （幂等自愈）；增量丢失检测归 hash 对账（phase-4）与兜底轮询（SDK）。
  // 未就绪 UNAVAILABLE（readiness 拦截器，语义同 Query）。
  rpc Subscribe(SubscribeRequest) returns (stream SubscriptionEvent);
}

// ---- 对账与新鲜度（SDK → discovery，架构 §2.2 外部端口；v0.3 phase-4，ADR-019 三件套之三）----

// 上游同步状态（新鲜度标记，数据枚举）：投影数据按来源 cluster 维度。SYNCED = 实时；
// 其余 = 投影冻结陈旧、继续服务（陈旧换可用，D-D5）。registry 自我保护态不进新鲜度
// （registry 内部概念，架构 §4.1 定案）。
enum UpstreamSyncState {
  UPSTREAM_SYNC_STATE_UNSPECIFIED = 0;
  UPSTREAM_SYNC_STATE_UNKNOWN = 1;       // 客户端无法识别的值（本地映射目标）
  UPSTREAM_SYNC_STATE_SYNCING = 2;       // 连接与首轮 bootstrap 进行中（含曾同步后的重连轮次）
  UPSTREAM_SYNC_STATE_SYNCED = 3;        // 已完成首轮同步，正在消费变更流
  UPSTREAM_SYNC_STATE_DISCONNECTED = 4;  // 曾同步但当前断连，等待重连（投影冻结）
}

// 上游新鲜度：拉取响应（查询/对账）的状态元信息，消费方感知数据降级（legacy 局限 #15 修复）
message UpstreamStatus {
  string cluster = 1;
  UpstreamSyncState state = 2;
}

// per-service 视图校验和（对账单元 = service 实例集快照视图，ADR-007/ADR-019）
message ServiceChecksum {
  artemis.common.v1.ServiceKey key = 1;
  uint32 checksum = 2;                   // canonical 规则见 api 文档（跨语言稳定，D-F2）
}

message ClusterChecksums {
  string cluster = 1;
  repeated ServiceChecksum services = 2;
}

// 对账请求：选择器与 QueryRequest/SubscribeRequest 同一语义（services 空 = 全部服务）
message ChecksumRequest {
  repeated artemis.common.v1.ServiceKey services = 1;
  map<string, string> labels = 2;        // checksum 计算于 labels 过滤后的视图（D-F1/D-F3）
  repeated string clusters = 3;          // 来源 cluster 过滤（语义同 QueryRequest，v0.3 phase-5）
}

message ChecksumResponseData {
  repeated ClusterChecksums clusters = 1;
  repeated UpstreamStatus upstreams = 2; // 新鲜度元信息（语义同查询响应，D-F4）
}

message ChecksumResponse {
  artemis.common.v1.ResponseStatus status = 1;
  ChecksumResponseData data = 2;
}

service DiscoveryReconciliationService {
  // hash 对账（ADR-019 三件套之三）：per-service 视图 checksum 表拉取——SDK 定期与本地
  // 逐 service 比对，不一致的 service 触发 Query 全量拉（增量丢失的显式检测，漂移窗口
  // = 对账周期）。响应只含视图中有实例的条目，缺项 = 该服务在视图中无实例（D-F1）。
  // 未就绪 UNAVAILABLE（readiness 拦截器，语义同 Query/Subscribe）。
  rpc Checksum(ChecksumRequest) returns (ChecksumResponse);
}

// ---- 静态节点目录（SDK 前置寻址；v0.3 phase-8，ADR-020）----

// 静态节点目录（部署声明）：不做存活探测、无节点 id（地址即标识）。
// 各节点配置同一份部署声明、原样返回；连通性由客户端失败上报 + 熔断兜底。
message DiscoveryNode {
  string host = 1;   // 对外 gRPC 端点；IPv6 带方括号
  int32 port = 2;
}

message DiscoveryNodesResponse {
  artemis.common.v1.ResponseStatus status = 1;
  repeated DiscoveryNode nodes = 2;
}
