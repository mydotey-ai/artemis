<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据所有权：事实源与投影</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Data Ownership</p>
    <h1>数据所有权：事实源与投影</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="structure-data-ownership-title structure-data-ownership-desc">
        <title id="structure-data-ownership-title">数据所有权：事实源与投影</title>
        <desc id="structure-data-ownership-desc">实例注册数据的事实源在客户端本地实例集，服务端注册表与其 peer 副本均为纯内存投影；发现视图是注册表经过滤器链加工的派生视图，消费方缓存为其快照且永不失效；管理面 DB 是流量治理元数据的唯一权威与唯一持久化，经三仓库轮询缓存注入发现过滤器。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== zone: artemis-server 单进程 ===== -->
        <rect x="368" y="84" width="240" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="380" y="88" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="97" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ARTEMIS-SERVER</text>

        <!-- ===== arrows (before nodes) ===== -->
        <!-- A1 本地实例集 -> 注册表 : 心跳对账 -->
        <path d="M 256,120 H 388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="286" y="102" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="111" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">心跳全量对账</text>

        <!-- A2 注册表 -> peer : 复制 -->
        <path d="M 588,120 H 716" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="604" y="102" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="111" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">复制 ×(N−1)</text>

        <!-- A3 注册表 -> 发现视图 : 直读 -->
        <path d="M 488,176 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="500" y="186" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="195" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">直读 · 过滤</text>

        <!-- A4 发现视图 -> 消费方缓存 : 推送 + 兜底 -->
        <path d="M 388,264 H 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="286" y="246" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="255" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">推送 · 兜底轮询</text>

        <!-- A5 管理面 DB -> 管理面缓存 : 轮询 -->
        <path d="M 716,392 H 588" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="610" y="374" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="383" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">轮询 1s / 5s</text>

        <!-- A6 管理面缓存 -> 发现视图 : 过滤器注入 -->
        <path d="M 488,352 V 304" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="500" y="314" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">过滤器注入</text>

        <!-- ===== nodes ===== -->
        <!-- N1 提供方 SDK · 本地实例集（事实源，focal） -->
        <rect x="40" y="96" width="216" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="216" height="80" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="48" y="102" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="63" y="111" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
        <text x="148" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">本地实例集</text>
        <text x="148" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">事实源 · 提供方进程内</text>
        <text x="148" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">InstanceRepository</text>

        <!-- N2 注册表（投影） -->
        <rect x="388" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="388" y="96" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="396" y="102" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.48)" stroke-width="0.8"/>
        <text x="411" y="111" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
        <text x="488" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">注册表</text>
        <text x="488" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">投影 · 纯内存</text>
        <text x="488" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">_services · _leases</text>

        <!-- N3 peer 注册表（副本投影） -->
        <rect x="716" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="96" width="200" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="724" y="102" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="741" y="111" fill="rgba(45,49,66,0.48)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PEER</text>
        <text x="816" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">peer 注册表</text>
        <text x="816" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">region 全量副本</text>
        <text x="816" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">投影 · 纯内存</text>

        <!-- N4 发现视图（派生） -->
        <rect x="388" y="224" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="388" y="224" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="396" y="230" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.48)" stroke-width="0.8"/>
        <text x="422" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCOVER</text>
        <text x="488" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发现视图</text>
        <text x="488" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">派生 · 过滤器链</text>
        <text x="488" y="292" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">快照 30s × 3</text>

        <!-- N5 消费方 SDK · 服务缓存（快照） -->
        <rect x="40" y="224" width="216" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="224" width="216" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="48" y="230" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="63" y="239" fill="rgba(45,49,66,0.48)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
        <text x="148" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务缓存</text>
        <text x="148" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">快照 · 永不失效</text>
        <text x="148" y="292" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">15min 兜底纠偏</text>

        <!-- N7 管理面缓存 -->
        <rect x="388" y="352" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="388" y="352" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="396" y="358" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.48)" stroke-width="0.8"/>
        <text x="414" y="367" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MGMT</text>
        <text x="488" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管理面缓存</text>
        <text x="488" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">三仓库轮询投影</text>
        <text x="488" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1s / 5s / 5s</text>

        <!-- N6 管理面 DB（权威） -->
        <rect x="716" y="352" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="352" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="816" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MySQL / SQLite</text>
        <text x="816" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">治理元数据 · 权威</text>
        <text x="816" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">唯一持久化</text>

        <!-- ===== legend ===== -->
        <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="110" y="497" width="12" height="12" rx="2" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1"/>
        <text x="130" y="508" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">事实源</text>

        <line x1="210" y1="503" x2="250" y2="503" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="258" y="508" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">同步读</text>

        <line x1="330" y1="503" x2="370" y2="503" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="378" y="508" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">异步投影</text>

        <!-- 论点注记：peer 注册表与 DB 之间的空白区 -->
        <text x="816" y="264" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', serif" text-anchor="middle">服务端无权威副本——重启即空，</text>
        <text x="816" y="284" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', serif" text-anchor="middle">靠客户端重注册与 peer 拉取重建</text>
      </svg>
    </div>
  </div>
</body>
</html>
