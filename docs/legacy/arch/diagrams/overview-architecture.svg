<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-architecture-title overview-architecture-desc" id="overview-architecture-root">
        <title id="overview-architecture-title">Artemis 原产品部署全景</title>
        <desc id="overview-architecture-desc">客户端 SDK 嵌入宿主进程、持有实例事实源；artemis-server 单进程内含接入层、服务内核与管理面三层；管理面独占 MySQL/SQLite 存储；服务内核经异步复制通道扇出到 region 内其余 N−1 个对等节点。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #overview-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #overview-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #overview-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #overview-architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="overview-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="overview-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="overview-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== zones (first) ===== -->
        <rect x="392" y="120" width="336" height="272" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="404" y="124" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="133" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SINGLE PROCESS</text>

        <!-- ===== arrows (before nodes) ===== -->
        <!-- A1 client -> edge : request channel -->
        <path d="M 264,248 H 320 Q 328,248 328,240 V 192 Q 328,184 336,184 H 416"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#overview-architecture-arrow-link)"/>
        <!-- A2 edge -> client : push, dashed return -->
        <path d="M 416,200 H 348 Q 340,200 340,208 V 280 Q 340,288 332,288 H 264"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#overview-architecture-arrow)"/>
        <!-- A3 management -> store -->
        <path d="M 704,344 H 732 Q 740,344 740,352 V 408 Q 740,416 748,416 H 768"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-architecture-arrow)"/>
        <!-- A4 kernel -> peers : replication, headline path -->
        <path d="M 704,264 H 768" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#overview-architecture-arrow-accent)"/>

        <!-- ===== arrow labels (mask then text) ===== -->
        <rect x="272" y="228" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP / WS</text>

        <rect x="282" y="268" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

        <rect x="706" y="372" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DAO</text>

        <rect x="730" y="242" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="748" y="254" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">复制</text>

        <!-- ===== nodes ===== -->
        <!-- N1 客户端 SDK -->
        <rect x="40" y="224" width="224" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="224" width="224" height="96" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="48" y="230" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="64" y="239" fill="#2d3142" fill-opacity="0.48" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
        <text x="152" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">客户端 SDK</text>
        <text x="152" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">artemis-client · in-process</text>

        <!-- N2 接入层 -->
        <rect x="416" y="152" width="288" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="416" y="152" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="424" y="158" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="446" y="167" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="560" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">接入层</text>
        <text x="560" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">11 rest controller · 3 ws handler</text>

        <!-- N3 服务内核 -->
        <rect x="416" y="232" width="288" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="416" y="232" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="424" y="238" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="450" y="247" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KERNEL</text>
        <text x="560" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务内核</text>
        <text x="560" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registry · discovery · cluster · lease</text>

        <!-- N4 管理面 -->
        <rect x="416" y="312" width="288" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="416" y="312" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="424" y="318" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="446" y="327" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MGMT</text>
        <text x="560" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管理面</text>
        <text x="560" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">group · zone · management caches</text>

        <!-- N5 peer 节点 -->
        <rect x="768" y="216" width="152" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="216" width="152" height="96" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="776" y="222" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="794" y="231" fill="#2d3142" fill-opacity="0.48" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PEER</text>
        <text x="844" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">peer ×(N−1)</text>
        <text x="844" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">region replica</text>

        <!-- N6 数据库 -->
        <rect x="768" y="380" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="380" width="152" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="844" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MySQL / SQLite</text>
        <text x="844" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20 tables · metadata</text>

        <!-- ===== legend ===== -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="559" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="132" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">进程内组件</text>

        <rect x="224" y="559" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="244" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">独立进程</text>

        <rect x="324" y="559" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="344" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">持久化存储</text>

        <line x1="436" y1="565" x2="476" y2="565" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="484" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">请求</text>

        <line x1="540" y1="565" x2="580" y2="565" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="588" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">推送</text>

        <line x1="644" y1="565" x2="684" y2="565" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="692" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">复制</text>

        <line x1="748" y1="565" x2="788" y2="565" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="796" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">管理</text>
      </svg>
