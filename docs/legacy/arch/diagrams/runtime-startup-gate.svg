<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-startup-gate-title runtime-startup-gate-desc" id="runtime-startup-gate-root">
        <title id="runtime-startup-gate-title">Artemis 启动门控流程</title>
        <desc id="runtime-startup-gate-desc">节点启动先于 Spring 初始化内核，随后进入 1 秒周期的门控循环：REGISTRY 与 DISCOVERY 两个目标都达成才置 UP，任一不达标则回到循环；空集群时 REGISTRY 永不达标，节点永久停在 STARTING。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #runtime-startup-gate-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #runtime-startup-gate-root { font-family: var(--font-sans); color: var(--color-ink); }
      #runtime-startup-gate-root .diagram-container { width: 100%; overflow-x: auto; }
      #runtime-startup-gate-root .diagram-container { overflow-x: visible; }</style>
          <marker id="runtime-startup-gate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="runtime-startup-gate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="runtime-startup-gate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== flow ===== -->
        <path d="M 480,94 V 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow)"/>
        <path d="M 480,180 V 204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow)"/>
        <path d="M 480,284 V 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow)"/>
        <path d="M 480,412 V 444" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow-accent)"/>
        <!-- No -> back to the loop -->
        <path d="M 656,244 H 712 Q 720,244 720,236 V 176 Q 720,168 712,168 H 656"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow)"/>
        <path d="M 656,372 H 744 Q 752,372 752,364 V 160 Q 752,152 744,152 H 656"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-startup-gate-arrow)"/>

        <!-- ===== branch labels ===== -->
        <rect x="492" y="300" width="20" height="16" rx="2" fill="#f5f5f5"/>
        <text x="502" y="312" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="492" y="420" width="20" height="16" rx="2" fill="#f5f5f5"/>
        <text x="502" y="432" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="688" y="182" width="20" height="16" rx="2" fill="#f5f5f5"/>
        <text x="698" y="194" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <rect x="722" y="280" width="20" height="16" rx="2" fill="#f5f5f5"/>
        <text x="732" y="292" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <!-- ===== callout ===== -->
        <text x="40" y="112" fill="#eb6c36" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif">空集群时 REGISTRY 永不达标</text>
        <path d="M 244,120 Q 292 172 296 232" fill="none"
              stroke="#eb6c36" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="296" cy="234" r="2" fill="#eb6c36"/>

        <!-- ===== shapes ===== -->
        <!-- start -->
        <circle cx="480" cy="88" r="6" fill="#2d3142"/>

        <!-- step -->
        <rect x="304" y="124" width="352" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="124" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">init：ClusterManager → NodeManager</text>
        <text x="480" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">management init runs first (optional)</text>

        <!-- decision 1 -->
        <polygon points="480,204 656,244 480,284 304,244" fill="#f5f5f5"/>
        <polygon points="480,204 656,244 480,284 304,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">REGISTRY 目标</text>
        <text x="480" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">full pull from a UP peer</text>

        <!-- decision 2 -->
        <polygon points="480,332 656,372 480,412 304,372" fill="#f5f5f5"/>
        <polygon points="480,332 656,372 480,412 304,372" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">DISCOVERY 目标</text>
        <text x="480" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">management cache refresh ok</text>

        <!-- end (happy path, accent) -->
        <rect x="384" y="444" width="192" height="44" rx="20" fill="#f5f5f5"/>
        <rect x="384" y="444" width="192" height="44" rx="20" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="471" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">status = UP · 放行</text>

        <!-- ===== legend ===== -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="136" y="557" width="18" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="162" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">动作</text>

        <polygon points="209,558 225,564 209,570 193,564" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="234" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">判定</text>

        <rect x="314" y="555" width="24" height="18" rx="9" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="346" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">就绪</text>

        <line x1="404" y1="565" x2="444" y2="565" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="452" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">1s 后重试（门控循环）</text>
      </svg>
