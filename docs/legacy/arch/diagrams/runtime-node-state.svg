<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-node-state-title runtime-node-state-desc" id="runtime-node-state-root">
        <title id="runtime-node-state-title">Artemis 服务端节点状态机</title>
        <desc id="runtime-node-state-desc">节点从 UNKNOWN 经 STARTING 的 1 秒门控循环进入 UP；force-down 把节点打成 DOWN 且撤销后不自行恢复，唯一出口是 force-up；UP 没有指向 STARTING 的回退边。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #runtime-node-state-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #runtime-node-state-root { font-family: var(--font-sans); color: var(--color-ink); }
      #runtime-node-state-root .diagram-container { width: 100%; overflow-x: auto; }
      #runtime-node-state-root .diagram-container { overflow-x: visible; }</style>
          <marker id="runtime-node-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="runtime-node-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="runtime-node-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== transitions (before states) ===== -->
        <!-- start -> UNKNOWN -->
        <path d="M 114,288 H 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>
        <!-- UNKNOWN -> STARTING -->
        <path d="M 312,288 H 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>
        <!-- STARTING self-loop: readiness gate, 1s -->
        <path d="M 424,256 V 224 Q 424,216 432,216 H 488 Q 496,216 496,224 V 256"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>
        <!-- STARTING -> UP : both readiness targets met -->
        <path d="M 544,272 H 700 Q 708,272 708,264 V 240"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>
        <!-- UP -> DOWN : force-down override -->
        <path d="M 756,240 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>
        <!-- DOWN -> UP : force-up override, the only exit from the sticky DOWN -->
        <path d="M 840,400 H 872 Q 880,400 880,392 V 216 Q 880,208 872,208 H 840"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-node-state-arrow)"/>

        <!-- ===== transition labels ===== -->
        <rect x="422" y="194" width="76" height="16" rx="2" fill="#f5f5f5"/>
        <text x="460" y="206" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">门控循环 1s</text>

        <rect x="612" y="250" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="646" y="262" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">两目标达成</text>

        <rect x="698" y="298" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="724" y="307" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORCE-DOWN</text>

        <rect x="822" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="846" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORCE-UP</text>

        <!-- ===== states ===== -->
        <!-- start dot -->
        <circle cx="108" cy="288" r="6" fill="#2d3142"/>

        <!-- UNKNOWN -->
        <rect x="152" y="256" width="160" height="64" rx="8" fill="#f5f5f5"/>
        <rect x="152" y="256" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="287" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UNKNOWN</text>
        <text x="232" y="305" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">构造期初值</text>

        <!-- STARTING -->
        <rect x="376" y="256" width="168" height="64" rx="8" fill="#f5f5f5"/>
        <rect x="376" y="256" width="168" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="287" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">STARTING</text>
        <text x="460" y="305" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据不全不接流量</text>

        <!-- UP -->
        <rect x="672" y="176" width="168" height="64" rx="8" fill="#f5f5f5"/>
        <rect x="672" y="176" width="168" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="756" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UP</text>
        <text x="756" y="225" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无回退</text>

        <!-- DOWN (accent: the trap state) -->
        <rect x="672" y="368" width="168" height="64" rx="8" fill="#f5f5f5"/>
        <rect x="672" y="368" width="168" height="64" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="756" y="399" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DOWN</text>
        <text x="756" y="417" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">粘性：撤销后不恢复</text>

        <!-- ===== legend ===== -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <circle cx="143" cy="565" r="6" fill="#2d3142"/>
        <text x="160" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">起点</text>

        <line x1="248" y1="565" x2="288" y2="565" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="296" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">迁移（标注触发事件）</text>

        <rect x="500" y="558" width="14" height="14" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="524" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">珊瑚色：陷阱态（撤销 force-down 后不自行恢复）</text>
      </svg>
