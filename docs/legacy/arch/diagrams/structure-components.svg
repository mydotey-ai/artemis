<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="structure-components-title structure-components-desc" id="structure-components-root">
        <title id="structure-components-title">核心组件与关系</title>
        <desc id="structure-components-desc">宿主进程内 registry-client 持有本地实例集（instance，事实源）经心跳全量上报注册，discovery-client 经 lookup 与订阅推送取视图；artemis-server 单进程内 registry-service 产生 NEW/DELETE 变更事件供 discovery-service 推送、经复制扇出到 region 内 peer，cluster 以成员表与节点状态对读写双向门控，management-service 经 DAO 读写 DB 并以 filter 注入发现、以合成伪实例复用推送管线。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #structure-components-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #structure-components-root { font-family: var(--font-sans); color: var(--color-ink); }
      #structure-components-root .diagram-container { width: 100%; overflow-x: auto; }
      #structure-components-root .diagram-container { overflow-x: visible; }</style>
          <marker id="structure-components-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="structure-components-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="structure-components-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== zones (first) ===== -->
        <rect x="40" y="84" width="260" height="456" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="52" y="88" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="80" y="97" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">宿主进程</text>

        <rect x="380" y="84" width="420" height="456" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="392" y="88" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="97" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">artemis-server 单进程</text>

        <!-- ===== arrows (before nodes) ===== -->
        <!-- A13 registry-client -> instance : 持有 -->
        <path d="M 164,224 V 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-components-arrow)"/>

        <!-- A1 registry-client -> registry-service : 心跳 · 补注册 -->
        <path d="M 272,264 H 342 Q 348,264 348,256 V 152 Q 348,144 354,144 H 470"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#structure-components-arrow-link)"/>

        <!-- A3 discovery-client -> discovery-service : lookup · 推送 -->
        <path d="M 272,416 H 318 Q 324,416 324,408 V 276 Q 324,268 330,268 H 470"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#structure-components-arrow-link)"/>

