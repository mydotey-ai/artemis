<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="structure-dependencies-title structure-dependencies-desc" id="structure-dependencies-root">
        <title id="structure-dependencies-title">Artemis 原产品包级依赖图</title>
        <desc id="structure-dependencies-desc">artemis-service 内 discovery、registry、cluster、status 与 registry.replication 五个包之间的依赖方向，cluster 与 registry.replication 互为依赖构成唯一一处包级环；lease 位于 artemis-common 模块，无反向依赖。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #structure-dependencies-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #structure-dependencies-root { font-family: var(--font-sans); color: var(--color-ink); }
      #structure-dependencies-root .diagram-container { width: 100%; overflow-x: auto; }
      #structure-dependencies-root .diagram-container { overflow-x: visible; }</style>
          <marker id="structure-dependencies-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="structure-dependencies-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="structure-dependencies-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== arrows (before nodes) ===== -->
        <!-- discovery -> registry -->
        <path d="M 340,136 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow)"/>
        <!-- discovery -> cluster (left corridor, clears registry) -->
        <path d="M 220,104 H 168 Q 160,104 160,112 V 336 Q 160,344 168,344 H 220"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow)"/>
        <!-- registry -> cluster -->
        <path d="M 340,256 V 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow)"/>
        <!-- registry -> lease -->
        <path d="M 460,224 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow)"/>
        <!-- cluster -> registry.replication (the cycle) -->
        <path d="M 460,336 H 560" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow-accent)"/>
        <!-- registry.replication -> cluster (the cycle) -->
        <path d="M 560,352 H 460" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow-accent)"/>
        <!-- note: coral is reserved for the two cycle edges only (budget: max 2) -->
        <!-- cluster -> status -->
        <path d="M 340,376 V 408 Q 340,416 348,416 H 672 Q 680,416 680,424 V 456"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#structure-dependencies-arrow)"/>

        <!-- ===== nodes ===== -->
        <!-- discovery -->
        <rect x="220" y="72" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="72" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="228" y="78" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="242" y="87" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="340" y="103" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discovery</text>
        <text x="340" y="121" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发现内核</text>

        <!-- registry -->
        <rect x="220" y="192" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="192" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="228" y="198" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="242" y="207" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="340" y="223" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">registry</text>
        <text x="340" y="241" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">注册表事实源</text>

        <!-- cluster -->
        <rect x="220" y="312" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="312" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="228" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="242" y="327" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="340" y="343" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cluster</text>
        <text x="340" y="361" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">成员与启动门控</text>

        <!-- registry.replication -->
        <rect x="560" y="312" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="312" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="582" y="327" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="680" y="343" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">registry.replication</text>
        <text x="680" y="361" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">复制收发</text>

        <!-- lease (common) -->
        <rect x="560" y="192" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="192" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="198" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="582" y="207" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="680" y="223" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lease</text>
        <text x="680" y="241" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">artemis-common · 租约基座</text>

        <!-- status -->
        <rect x="560" y="456" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="456" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="462" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.48" stroke-width="0.8"/>
        <text x="582" y="471" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
        <text x="680" y="487" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">status</text>
        <text x="680" y="505" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">节点状态查询</text>

        <!-- ===== legend ===== -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="136" y1="565" x2="176" y2="565" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="184" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">唯一的环：cluster ⇄ registry.replication</text>

        <line x1="600" y1="565" x2="640" y2="565" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="648" y="568" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">依赖方向</text>
      </svg>
