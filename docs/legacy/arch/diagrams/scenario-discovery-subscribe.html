<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现与订阅推送端到端</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC',
                     'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei',
                     system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif CJK SC',
                     'Source Han Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Discovery · F1–F5</p>
    <h1>发现与订阅推送（推送 + 三层兜底）</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenario-discovery-subscribe-title scenario-discovery-subscribe-desc">
        <title id="scenario-discovery-subscribe-title">发现与订阅推送端到端</title>
        <desc id="scenario-discovery-subscribe-desc">消费方首次 getService 触发同步 lookup 取得过滤器链派生的 Service 视图，随后经 WS 订阅增量推送；推送为 at-most-once，丢失与空服务由 60 秒批量 lookup 兜底，距上次全量超过 15 分钟时全量纠偏。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== marginal note (top-right) ===== -->
        <text x="940" y="40" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', serif" text-anchor="end">at-most-once · 纠偏是全量，不是单条重发</text>

        <!-- ===== actors ===== -->
        <rect x="100" y="56" width="200" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="56" width="200" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="200" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">消费方 SDK</text>
        <text x="200" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">artemis-client</text>

        <rect x="400" y="56" width="200" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="56" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务端 · 发现内核</text>
        <text x="500" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lookup + NotificationCenter</text>

        <rect x="700" y="56" width="200" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="56" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">注册表 · 变更事件</text>
        <text x="800" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">跳表 · 有界 1 万</text>

        <!-- ===== lifelines ===== -->
        <line x1="200" y1="100" x2="200" y2="724" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="100" x2="500" y2="724" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="100" x2="800" y2="724" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ===== activation bars ===== -->
        <rect x="196" y="188" width="8" height="152" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="188" width="8" height="284" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="796" y="364" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ===== messages ===== -->
        <!-- m1 self L1: getService -->
        <path d="M 200,142 h 28 a 4,4 0 0 1 4,4 v 12 a 4,4 0 0 1 -4,4 h -20" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="244" y="156" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">getService</text>

        <!-- m2 L1 -> L2 : lookup -->
        <line x1="204" y1="196" x2="496" y2="196" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="308" y="178" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="187" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">lookup HTTP</text>

        <!-- m3 self L2 : 直读 + 过滤器链 -->
        <path d="M 500,224 h 28 a 4,4 0 0 1 4,4 v 12 a 4,4 0 0 1 -4,4 h -20" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="544" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">直读 + 过滤器链</text>

        <!-- m4 L2 --> L1 : Service 派生视图 (headline return) -->
        <line x1="496" y1="284" x2="204" y2="284" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <rect x="288" y="266" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Service 派生视图</text>

        <!-- m5 L1 -> L2 : 订阅 (async) -->
        <line x1="204" y1="328" x2="496" y2="328" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
        <rect x="316" y="310" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">订阅 · WS</text>

        <!-- m6 L3 -> L2 : 变更事件 (async) -->
        <line x1="796" y1="372" x2="504" y2="372" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
        <rect x="608" y="354" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NEW / DELETE</text>

        <!-- m7 self L2 : 消费 · 过滤 · 发送 -->
        <path d="M 500,400 h 28 a 4,4 0 0 1 4,4 v 12 a 4,4 0 0 1 -4,4 h -20" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="544" y="414" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">消费 · 过滤 · 发送</text>

        <!-- m8 L2 -> L1 : 推送增量 (async) -->
        <line x1="496" y1="460" x2="204" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
        <rect x="316" y="442" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="451" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">推送增量</text>

        <!-- ===== alt fragment: 兜底 ===== -->
        <rect x="184" y="508" width="332" height="212" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="184" y="508" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="204" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="196" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[丢推 / 空服务 · 60s]</text>

        <!-- m10 L1 -> L2 : 批量 lookup -->
        <line x1="204" y1="566" x2="496" y2="566" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="308" y="548" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">批量 lookup</text>

        <!-- m11 L2 --> L1 : 替换缓存 -->
        <line x1="496" y1="600" x2="204" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="312" y="582" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="591" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">替换缓存</text>

        <!-- divider -->
        <line x1="192" y1="628" x2="508" y2="628" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="196" y="650" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[距全量 &gt; 15min]</text>

        <!-- m12 L1 -> L2 : 全量 lookup -->
        <line x1="204" y1="684" x2="496" y2="684" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="312" y="666" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="675" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">全量纠偏</text>

        <!-- m13 L2 --> L1 : RELOAD -->
        <line x1="496" y1="706" x2="204" y2="706" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="320" y="688" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="697" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RELOAD</text>
      </svg>
    </div>
  </div>
</body>
</html>
