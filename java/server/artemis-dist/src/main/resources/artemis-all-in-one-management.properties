# all-in-one management 上下文配置（spring.config.name 隔离：单服务 application.properties 不参与加载）。
# 端口与 registry 查询端点不经本文件：launcher 以命令行参数注入，组合期键见 docs/api/all-in-one.md
spring.application.name=artemis-management

# 内部管理端口：actuator（health/prometheus），默认仅绑本机
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# 停机：规则流 at-most-once（断流由 discovery 重连快照自愈），无排水语义，尽快关闭
spring.grpc.server.shutdown.grace-period=1s

# DB 接入（可选依赖，双轨）：未配置 spring.datasource.url 时零 DB 装配（内存态，单机 eval 零 DB）；
# 配置后（经 Spring 标准途径，仅本上下文消费）HikariCP + Flyway 自动装配，
# migration 脚本按 url 方言取 vendor 目录（MySQL/PostgreSQL 各自维护）
spring.flyway.locations=classpath:db/migration/{vendor}

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
