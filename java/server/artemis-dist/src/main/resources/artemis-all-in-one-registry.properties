# all-in-one registry 上下文配置（spring.config.name 隔离：单服务 application.properties 不参与加载）。
# 端口不经本文件：launcher 以命令行参数注入，组合期键见 docs/api/all-in-one.md（artemis.dist.*）
spring.application.name=artemis-registry

# 内部管理端口：actuator（health/readiness/prometheus），默认仅绑本机
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,registryReadiness

# 停机：应用层排水结束后 gRPC 端口尽快关闭（排水窗口承担「存量流量服务到底」，只留在途调用收尾）
spring.grpc.server.shutdown.grace-period=1s

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
