spring.application.name=artemis-discovery

# 外部端口：gRPC 数据面（查询/订阅/对账）；HTTP 管理面 /admin/v1（只读，v0.3 phase-7）
# HTTP 管理面与 gRPC 共用外部账户 artemis.discovery.auth.*（默认关闭）
spring.grpc.server.port=9095
server.port=8090

# 内部管理端口：actuator（health/readiness/prometheus），默认仅绑本机
management.server.port=9096
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,discoveryReadiness

# 上游 registry 集群 map（必填：JSON map，键 = clusterId（投影 cluster 维度值，ADR-014），
# 值 = 该集群端点逗号分隔列表；多集群 union 聚合，phase-5）
# artemis.discovery.registry.clusters={"default":"registry-1:9093,registry-2:9093"}

# 静态节点目录（SDK 前置寻址，phase-8 ADR-020）：host:port 逗号分隔的部署声明，
# 经外部 HTTP GET /cluster/nodes 返回（protobuf，复用外部账户，未就绪 503）；
# 未配置 = 空目录（SDK 前置寻址拉不到地址，要用 SDK 寻址必须配置）
# artemis.discovery.nodes=discovery-1:9095,discovery-2:9095

# management 摘除规则流（可选 0..1，phase-6）：未配置 = 不过滤；配置 = 订阅规则流并应用
# 摘除过滤（查询/推送/对账一致）；management 不可用时沿用最后已知规则（fail-open）
# artemis.discovery.management.endpoints=management-1:9094
# artemis.discovery.management.auth.enabled=false
# artemis.discovery.management.auth.username=
# artemis.discovery.management.auth.password=

# 停机：gRPC 端口尽快关闭（discovery 无排水语义，phase-2）
spring.grpc.server.shutdown.grace-period=1s

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
