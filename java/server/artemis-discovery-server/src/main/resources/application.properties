spring.application.name=artemis-discovery

# 外部端口：gRPC 查询（SDK 订阅推送随 phase-3 递补）；HTTP 辅助通道按需递补
spring.grpc.server.port=9095
server.port=8090

# 内部管理端口：actuator（health/readiness/prometheus），默认仅绑本机
management.server.port=9096
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,discoveryReadiness

# 上游 registry（必填：host:port 逗号分隔；clusterId 为投影 cluster 维度值，ADR-014）
# artemis.discovery.upstream.endpoints=registry-1:9093,registry-2:9093
artemis.discovery.upstream.clusterId=default

# 停机：gRPC 端口尽快关闭（discovery 无排水语义，phase-2）
spring.grpc.server.shutdown.grace-period=1s

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
