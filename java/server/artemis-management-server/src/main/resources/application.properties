spring.application.name=artemis-management

# 外部 HTTP：Admin/状态 API（独立服务端口；registry 默认 8080）
server.port=8081

# 内部 gRPC：摘除规则流端口（v0.3 phase-6，discovery 订阅；条件启用——
# 配置 artemis.management.grpc.port 才监听，未配置 -1 = 不监听，management 独立运行）
# artemis.management.grpc.port=9094
spring.grpc.server.port=${artemis.management.grpc.port:-1}
# artemis.management.grpc.auth.enabled=false
# artemis.management.grpc.auth.username=
# artemis.management.grpc.auth.password=

# 停机：规则流 at-most-once（断流由 discovery 重连快照自愈），无排水语义，尽快关闭
spring.grpc.server.shutdown.grace-period=1s

# 内部管理端口：actuator（health/prometheus），与外部端口分离
# 默认仅绑本机；容器/集群部署显式改 management.server.address 并配网络策略
management.server.port=9092
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启。
# 注意不是全局 management.tracing.export.enabled——那会连传播/自动配置一起关掉
management.tracing.export.otlp.enabled=false
# OTel starter 会带入 micrometer OTLP metrics push registry：默认关闭，避免无 collector 时持续外发
management.otlp.metrics.export.enabled=false
