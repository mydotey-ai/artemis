spring.application.name=artemis-registry

# 外部端口：gRPC（SDK 四操作/心跳）与 HTTP 辅助通道
spring.grpc.server.port=9090
server.port=8080

# 内部管理端口：actuator（health/readiness/prometheus），与外部端口分离
# 默认仅绑本机；容器/集群部署显式改 management.server.address 并配网络策略
management.server.port=9091
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,registryReadiness

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启。
# 注意不是全局 management.tracing.export.enabled——那会连传播/自动配置一起关掉
management.tracing.export.otlp.enabled=false
# OTel starter 会带入 micrometer OTLP metrics push registry：默认关闭，避免无 collector 时持续外发
management.otlp.metrics.export.enabled=false
