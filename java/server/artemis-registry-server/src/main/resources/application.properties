spring.application.name=artemis-registry

# 外部端口：gRPC（SDK 四操作/心跳）与 HTTP 辅助通道
spring.grpc.server.port=9090
server.port=8080

# 内部 peer 端口：peer 复制/成员状态 + management 只读查询，与外部端口分离。
# 内部认证默认关闭（artemis.registry.internal.auth.enabled=false），启用时须显式配置凭证
artemis.registry.internal.port=9093

# TLS（默认明文；显式启用，架构 §6 内外通道均可启）。外部 gRPC/HTTP 走 Spring SSL bundle（框架键）：
#   spring.ssl.bundle.pem.artemis.keystore.certificate=/path/cert-chain.pem
#   spring.ssl.bundle.pem.artemis.keystore.private-key=/path/private-key.pem
#   spring.grpc.server.ssl.enabled=true
#   spring.grpc.server.ssl.bundle=artemis
#   server.ssl.bundle=artemis
# 内部 peer 端口 TLS（入站证书 + 出站 peer 连接信任同组键；证书须带 SAN 覆盖成员地址）：
#   artemis.registry.internal.tls.enabled=true
#   artemis.registry.internal.tls.certChainPath=/path/peer-cert-chain.pem
#   artemis.registry.internal.tls.privateKeyPath=/path/peer-private-key.pem
#   artemis.registry.internal.tls.trustCaPath=/path/peer-trust-ca.pem

# 内部管理端口：actuator（health/readiness/prometheus），与外部端口分离
# 默认仅绑本机；容器/集群部署显式改 management.server.address 并配网络策略
management.server.port=9091
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,registryReadiness

# 停机：应用层排水（artemis.registry.shutdown.drainMs）结束后 gRPC 端口应尽快关闭。
# gRPC 优雅停机默认 grace-period = 30s，会让「排水 10s + 关停 30s」超出常见 K8s 终止宽限期；
# 排水窗口已承担「存量流量服务到底」职责，此处只留 1s 给在途调用收尾
spring.grpc.server.shutdown.grace-period=1s

# trace：仅关闭 OTLP 导出（本地/eval 无 collector）；传播与 span 保持开启。
# 注意不是全局 management.tracing.export.enabled——那会连传播/自动配置一起关掉
management.tracing.export.otlp.enabled=false
# OTel starter 会带入 micrometer OTLP metrics push registry：默认关闭，避免无 collector 时持续外发
management.otlp.metrics.export.enabled=false
