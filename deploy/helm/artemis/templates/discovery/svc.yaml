{{- if .Values.discovery.enabled }}
# discovery svc：消费方 SDK 数据面（gRPC 查询/订阅 + HTTP /cluster/nodes 节点目录）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.fullname" . }}-discovery
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
spec:
  selector:
    {{- include "artemis.selectorLabels" (dict "Release" .Release "component" "discovery") | nindent 4 }}
  ports:
    - name: http
      port: 8090
    - name: grpc
      port: 9095
{{- end }}
