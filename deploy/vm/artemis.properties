# Artemis all-in-one 服务端配置模板（工作目录 SCF source；build-dist.sh 打包时置于安装包根）。
# 全量配置键与语义：docs/deploy/config-reference.md（组合端口 artemis.dist.* 与组合语义另见 docs/api/all-in-one.md）。
# 优先级：系统属性 > 环境变量 > 本文件；修改后重启生效（静态键）。

# ---- 组合端口（artemis.dist.*，默认见 docs/api/all-in-one.md）----
# artemis.dist.registry.grpcPort=9090
# artemis.dist.registry.httpPort=8080
# artemis.dist.registry.managementPort=9091
# artemis.dist.registry.peerPort=9093
# artemis.dist.management.grpcPort=9094
# artemis.dist.management.httpPort=8081
# artemis.dist.management.managementPort=9092
# artemis.dist.discovery.grpcPort=9095
# artemis.dist.discovery.httpPort=8090
# artemis.dist.discovery.managementPort=9096

# ---- 认证（默认开启，默认账户 artemis/artemis；关闭置 enabled=false，须以网络隔离补偿）----
# artemis.registry.auth.enabled=true
# artemis.registry.auth.username=artemis
# artemis.registry.auth.password=artemis
# artemis.management.auth.enabled=true
# artemis.management.auth.username=artemis
# artemis.management.auth.password=artemis

# ---- DB（可选：management 持久化；不配置则内存态、零 DB 依赖）----
# 接 DB 用 Spring 标准途径（环境变量 SPRING_DATASOURCE_URL 或系统属性 spring.datasource.url），
# 不设 artemis.dist.* 映射键；仅 management 上下文消费，见 docs/api/all-in-one.md「DB 双轨」。

# ---- 数据目录 ----
# registry 快照默认 <工作目录>/data/registry-snapshot.bin（相对路径，随包内 data/ 目录）
